name: SmartCleanup
options:
  bundleIdPrefix: com.jkoldun
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
targets:
  SmartCleanup:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: "Aplikacja potrzebuje dostępu do zdjęć, żeby nauczyć się, które chcesz zachować, a które usunąć."
        UILaunchScreen: {}
        CFBundleLocalizations: [pl, en, de, fr, es]
        CFBundleDevelopmentRegion: pl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkoldun.smartcleanup
        DEVELOPMENT_TEAM: 4PNQYUCGMP
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
