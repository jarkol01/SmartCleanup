name: SmartCleanup
options:
  bundleIdPrefix: com.jkoldun
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
targets:
  SmartCleanup:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: SmartCleanupWidget
    entitlements:
      path: Sources/SmartCleanup.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jkoldun.smartcleanup]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [smartcleanup]
        NSPhotoLibraryUsageDescription: "Aplikacja potrzebuje dostępu do zdjęć, żeby nauczyć się, które chcesz zachować, a które usunąć."
        UILaunchScreen: {}
        CFBundleLocalizations: [pl, en, de, fr, es]
        CFBundleDevelopmentRegion: pl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkoldun.smartcleanup
        DEVELOPMENT_TEAM: 4PNQYUCGMP
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
  SmartCleanupWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
      - path: Sources/Services/StorageStore.swift
      - path: Sources/Localizable.xcstrings
    entitlements:
      path: Widget/SmartCleanupWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.jkoldun.smartcleanup]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SmartCleanup
        CFBundleLocalizations: [pl, en, de, fr, es]
        CFBundleDevelopmentRegion: pl
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkoldun.smartcleanup.widget
        DEVELOPMENT_TEAM: 4PNQYUCGMP
        CODE_SIGN_IDENTITY: "iPhone Developer"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: "YES"
  # Host-less: compiles only the pure detectors, so it runs on the Simulator (the app can't — CreateML).
  SmartCleanupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Sources/Services/BlurDetector.swift
      - path: Sources/Services/DuplicateDetector.swift
      - path: Sources/Services/PhotoLibraryService.swift
      - path: Sources/Services/SettingsStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jkoldun.smartcleanup.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: "YES"
    scheme:
      testTargets: [SmartCleanupTests]
